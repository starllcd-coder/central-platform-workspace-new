name: laundrex_mobile_app
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.2.3
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.1
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/fonts/
