<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Central Platform | Login</title>
  <link rel="icon" type="image/x-icon" href="assets/DSS_icon.ico" />
  <link rel="stylesheet" href="static/css/styles.css" />
</head>
<body>
  <main class="login-wrap">
    <section class="login-card">
      <aside class="login-brand">
        <div>
          <img src="assets/Logo.png" alt="DriveSphere Suite" />
          <h1>Central Platform Control Plane</h1>
          <p>Manage StayLux, DriveSphere, and Laundrex from one elegant command center.</p>
        </div>
        <p class="small">Multi-tenant admin portal | Unified billing | Module control</p>
      </aside>
      <div class="login-form">
        <h2>Welcome back</h2>
        <p class="sub">Sign in to continue to your operations dashboard.</p>
        <form action="dashboard.html">
          <label>Email</label>
          <input type="email" placeholder="admin@company.com" required />
          <label>Password</label>
          <input type="password" placeholder="Enter password" required />
          <div class="row">
            <label class="small"><input type="checkbox" style="width:auto;margin:0 6px 0 0;"> Remember me</label>
            <a class="small" href="#">Forgot password?</a>
          </div>
          <div style="height:14px"></div>
          <button class="btn btn-primary" type="submit">Sign In</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
