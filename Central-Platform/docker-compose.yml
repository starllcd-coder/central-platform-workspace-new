services:
  db:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be an immutable tag or digest}
    container_name: central_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DJANGO_DB_NAME:-central_platform}
      POSTGRES_USER: ${DJANGO_DB_USER:-central}
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD:?DJANGO_DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DJANGO_DB_USER:-central} -d ${DJANGO_DB_NAME:-central_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE must be an immutable tag or digest}
    container_name: central_platform_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    cpus: ${REDIS_CPU_LIMIT:-0.5}

  migrate:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?PYTHON_IMAGE must be an immutable tag or digest}
    command: python manage.py migrate --noinput
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "0"
      DJANGO_DB_BACKEND: postgres
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: 5432
      DJANGO_DB_SSLMODE: ${DJANGO_DB_SSLMODE:-prefer}
      DJANGO_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MIGRATE_MEMORY_LIMIT:-512m}
    cpus: ${MIGRATE_CPU_LIMIT:-1.0}

  web:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?PYTHON_IMAGE must be an immutable tag or digest}
    container_name: central_platform_web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "0"
      DJANGO_DB_BACKEND: postgres
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: 5432
      DJANGO_DB_SSLMODE: ${DJANGO_DB_SSLMODE:-prefer}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS},health.local
      DJANGO_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/healthz', headers={'Host':'health.local','X-Forwarded-Proto':'https'}), timeout=5); raise SystemExit(0 if r.status == 200 else 1)"
      interval: 15s
      timeout: 8s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: ${WEB_MEMORY_LIMIT:-1g}
    cpus: ${WEB_CPU_LIMIT:-1.0}

  celery-worker:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?PYTHON_IMAGE must be an immutable tag or digest}
    container_name: central_platform_celery_worker
    command: celery -A config worker -l info
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "0"
      DJANGO_DB_BACKEND: postgres
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: 5432
      DJANGO_DB_SSLMODE: ${DJANGO_DB_SSLMODE:-prefer}
      DJANGO_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: ${WORKER_MEMORY_LIMIT:-1g}
    cpus: ${WORKER_CPU_LIMIT:-1.0}

  celery-beat:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?PYTHON_IMAGE must be an immutable tag or digest}
    container_name: central_platform_celery_beat
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "0"
      DJANGO_DB_BACKEND: postgres
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: 5432
      DJANGO_DB_SSLMODE: ${DJANGO_DB_SSLMODE:-prefer}
      DJANGO_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: ${BEAT_MEMORY_LIMIT:-256m}
    cpus: ${BEAT_CPU_LIMIT:-0.25}

volumes:
  postgres_data:
  redis_data:
