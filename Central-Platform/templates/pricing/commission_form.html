{% extends "core/app_shell.html" %}
{% block page_title %}{{ title }}{% endblock %}
{% block page_content %}
<section class="card" style="max-width:860px;">
  <h2 class="section-title">{{ title }}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <div class="row">
      <button class="btn btn-primary" type="submit" style="width:auto;">{{ submit_label }}</button>
      <a class="btn btn-soft" href="{% url 'pricing-list' %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
